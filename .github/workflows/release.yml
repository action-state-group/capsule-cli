name: Release

# Builds capsulectl for linux/amd64, linux/arm64 and darwin/arm64 when a v*
# tag is pushed, and attaches the binaries plus SHA256SUMS to the GitHub
# release for that tag. The build is scripts/release-build.sh, so a tag can be
# rebuilt locally with the same Go version and compared against SHA256SUMS.
# Each binary also gets a GitHub build provenance attestation (Sigstore,
# keyless: no release key is held anywhere), verifiable with
#   gh attestation verify capsulectl-<version>-<os>-<arch> --repo action-state-group/capsule-cli \
#     --signer-workflow action-state-group/capsule-cli/.github/workflows/release.yml
# The attestation bundle is also published, as capsulectl-<version>.sigstore.json,
# so the same check runs with no GitHub account: add --bundle with that file.
# Each release is also registered in a public transparency log, and an
# independent monitor compares the log with the maintainer-signed tags
# (docs/RELEASE-TRANSPARENCY.md).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: scripts/release-build.sh "$VERSION" "$COMMIT" dist
      - name: Check the version the binary reports
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          got="$(dist/capsulectl-"$VERSION"-linux-amd64 --version)"
          test "$got" = "capsulectl $VERSION (commit $COMMIT)" || { echo "unexpected: $got"; exit 1; }
      - name: Attest build provenance of the binaries
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/capsulectl-*
      - name: Attach the attestation bundle
        # One attestation names every binary, so one bundle file covers them
        # all. Publishing it lets anyone verify a binary's provenance with no
        # GitHub account: gh attestation verify FILE --bundle BUNDLE ...
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" "dist/capsulectl-$VERSION.sigstore.json"
          (cd dist && sha256sum "capsulectl-$VERSION.sigstore.json" >> SHA256SUMS)
      - name: Register the release in the transparency log
        # docs/RELEASE-TRANSPARENCY.md. Writes capsulectl-<tag>.release.json
        # (tag, commit, every binary's and the bundle's SHA-256), signs it as
        # a COSE statement with a key made for this release and discarded,
        # registers it at the public witness, and checks the receipt offline.
        # A release that cannot be logged is not published.
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: go run ./cmd/capsulectl release register --dir dist --tag "$VERSION" --commit "$COMMIT"
      - name: Attest release.json
        # Ties the statement (and the one-release key it names) to this
        # workflow at this tag: the statement's own signature cannot.
        id: attest-release
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.release.json
      - name: Attach the release statement files
        env:
          BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" "dist/capsulectl-$VERSION.release.sigstore.json"
          (cd dist && sha256sum "capsulectl-$VERSION.release.json" "capsulectl-$VERSION.release.cose" \
            "capsulectl-$VERSION.release.registration.json" "capsulectl-$VERSION.release.sigstore.json" >> SHA256SUMS)
      - name: Publish GitHub release
        # A tag with a hyphen (v0.1.0-rc4, v1.0.0-beta1) is a pre-release:
        # published as such and never marked the latest release.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "${#flags[@]}" -gt 0 ]; then
              gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
            fi
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "capsulectl $VERSION" \
              --notes "Prebuilt capsulectl binaries (linux/amd64, linux/arm64, darwin/arm64). Verify with: sha256sum -c SHA256SUMS. Check the build attestation with no GitHub account: gh attestation verify FILE --bundle capsulectl-$VERSION.sigstore.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          fi
