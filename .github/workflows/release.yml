name: Release

# Builds capsulectl for linux/amd64, linux/arm64 and darwin/arm64 when a v*
# tag is pushed, and attaches the binaries plus SHA256SUMS to the GitHub
# release for that tag. The build is scripts/release-build.sh, so a tag can be
# rebuilt locally with the same Go version and compared against SHA256SUMS.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: scripts/release-build.sh "$VERSION" "$COMMIT" dist
      - name: Check the version the binary reports
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          got="$(dist/capsulectl-"$VERSION"-linux-amd64 --version)"
          test "$got" = "capsulectl $VERSION (commit $COMMIT)" || { echo "unexpected: $got"; exit 1; }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "capsulectl $VERSION" \
              --notes "Prebuilt capsulectl binaries (linux/amd64, linux/arm64, darwin/arm64). Verify with: sha256sum -c SHA256SUMS"
          fi
