name: Release

# Builds capsulectl for linux/amd64, linux/arm64 and darwin/arm64 when a v*
# tag is pushed, and attaches the binaries plus SHA256SUMS to the GitHub
# release for that tag. The build is scripts/release-build.sh, so a tag can be
# rebuilt locally with the same Go version and compared against SHA256SUMS.
# Each binary also gets a GitHub build provenance attestation (Sigstore,
# keyless: no release key is held anywhere), verifiable with
#   gh attestation verify capsulectl-<version>-<os>-<arch> --repo action-state-group/capsule-cli \
#     --signer-workflow action-state-group/capsule-cli/.github/workflows/release.yml
# The attestation bundle is also published, as capsulectl-<version>.sigstore.json,
# so the same check runs with no GitHub account: add --bundle with that file.
# What these prove, and what keeps a release nobody meant from reaching
# users, is in docs/RELEASE-TRANSPARENCY.md.
#
# Nothing is published until a person approves the run (docs/RELEASING.md).
# A full release runs in the `release` environment, where whoever pushed the
# tag cannot approve it; a pre-release (a tag with a hyphen) runs in
# `release-candidate`, where they can. Each environment only accepts tags of
# its kind, so a full release cannot choose the weaker one. The settings are
# in scripts/release-settings.sh. Every Action is pinned by commit SHA.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ contains(github.ref_name, '-') && 'release-candidate' || 'release' }}
    permissions:
      contents: write
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - name: Refuse a full release re-run by someone else
        # Prevent self-review stops whoever started a run from approving it,
        # and a re-run is started by whoever re-ran it. The tag's pusher could
        # then approve their own full release, so that run stops here, before
        # anything is built (docs/RELEASING.md).
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$ACTOR" = "$TRIGGERING_ACTOR" \
            || { echo "$GITHUB_REF_NAME was pushed by $ACTOR but this run was started by $TRIGGERING_ACTOR: cut the next version"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag follows the release tag policy
        # The same policy as cli/plugin_install.go (releaseTagPolicy): a core
        # whose version matches it is a release build, which checks a
        # first-party plugin's core_version against its own.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?' \
            || { echo "tag $VERSION does not follow the release tag policy"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: scripts/release-build.sh "$VERSION" "$COMMIT" dist
      - name: Check the version the binary reports
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          got="$(dist/capsulectl-"$VERSION"-linux-amd64 --version)"
          test "$got" = "capsulectl $VERSION (commit $COMMIT)" || { echo "unexpected: $got"; exit 1; }
      - name: Attest build provenance of the binaries
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/capsulectl-*
      - name: Attach the attestation bundle
        # One attestation names every binary, so one bundle file covers them
        # all. Publishing it lets anyone verify a binary's provenance with no
        # GitHub account: gh attestation verify FILE --bundle BUNDLE ...
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" "dist/capsulectl-$VERSION.sigstore.json"
          (cd dist && sha256sum "capsulectl-$VERSION.sigstore.json" >> SHA256SUMS)
      - name: Publish GitHub release
        # A tag with a hyphen (v0.1.0-rc4, v1.0.0-beta1) is a pre-release:
        # published as such and never marked the latest release. gh creates
        # the release as a draft, uploads, then publishes, which immutable
        # releases allow. A draft left by a run that died mid-upload is
        # finished here; a published release is never changed.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "release $VERSION is already published and cannot change: cut the next version"
              exit 1
            fi
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "capsulectl $VERSION" \
              --notes "Prebuilt capsulectl binaries (linux/amd64, linux/arm64, darwin/arm64). Verify with: sha256sum -c SHA256SUMS. Check the build attestation with no GitHub account: gh attestation verify FILE --bundle capsulectl-$VERSION.sigstore.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          fi
