name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: every case under the race detector (see the tests job's env).
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # The nightly run has a group of its own: a push to main must not cancel it
  # (pushes and PRs still cancel their own superseded runs).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Refuse committed env files
        run: |
          # .gitignore excludes .env and .env.*; this catches one committed anyway (git add -f, a
          # rename). Example files (*.example) are allowed. ls-files runs on its own line, so a
          # failure fails the step instead of reading as "no env files".
          tracked="$(git ls-files)"
          bad="$(printf '%s\n' "$tracked" | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$bad" ]; then
            printf '::error::env file(s) committed; remove them from the repository and rotate any secret they held:\n%s\n' "$bad"
            exit 1
          fi
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Check the rendered skill files match spec.yaml
        run: go run ./cmd/skillgen --check
      - name: Build CLI
        run: make build

  tests:
    # The race detector (the slowest case loops sampled), then every case
    # without it: see scripts/test.sh.
    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: default, args: "" }
    name: test (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: capsule_cli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Explicitly enable integration tests against the disposable service.
      CAPSULE_CLI_TEST_MYSQL_PORT: "3306"
      # The nightly run samples nothing: every case under the race detector.
      CAPSULE_TEST_RACE_FULL: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and MySQL integration tests, with and without the race detector
        run: bash scripts/test.sh ${{ matrix.build.args }}

  test:
    # One result under the job name checks and the PR capsule already use.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests passed
        run: test "${{ needs.tests.result }}" = success

  report-page:
    # The README's report of sealed records, opened in headless Chrome (the
    # runner's own): the page must render the report and say it verified, and
    # a copy with one payload edited must say it failed. See
    # scripts/check-html-render.sh.
    name: report page renders and checks itself
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the report and check its page
        env:
          CHROME: google-chrome
        run: bash scripts/check-html-render.sh

  interop-at-resolved-versions:
    # evidencebook's own CI runs this Go <-> Python round trip against ITS pins;
    # capsulectl links newer ones (minimal version selection), so here the same
    # round trip runs with evidencebook as THIS go.mod resolves it, compiled with
    # this module's graph. The log prints `go list -m all`. Python verifier
    # scripts come from evidencebook at the resolved version; the Python stack is
    # pinned as evidencebook's CI pins it.
    name: interop at the resolved versions (Go <-> Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: The evidencebook version this module resolves
        id: resolved
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/action-state-group/evidencebook)
          # Module pseudo-versions are not Git refs. Origin identifies the same
          # source commit for both tagged releases and preparation revisions.
          commit=$(go mod download -json "github.com/action-state-group/evidencebook@$version" | jq -er '.Origin.Hash')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "evidencebook=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out evidencebook at that version (its Python verifier scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/evidencebook
          ref: ${{ steps.resolved.outputs.evidencebook }}
          path: .interop/evidencebook
      - name: Check out Python CLL (as evidencebook's CI pins it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 88e99d405241aee790f6795fda612527679114ba
          path: .interop/checkpointed-local-log
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit (locked, with hashes)
        # Python CLL from its pinned commit, without dependencies (a checkout cannot be
        # hash-pinned); then everything else, its dependencies included, from the
        # hash-locked file. See scripts/interop-requirements.in for how it is made.
        run: |
          python -m pip install --no-deps ./.interop/checkpointed-local-log
          python -m pip install --require-hashes -r scripts/interop-requirements.txt
          python -m pip check
      - name: The round trip, both ways, with the tampered copies refused
        run: bash scripts/interop-resolved.sh .interop/evidencebook

  iife:
    # The vendored evidence-graph IIFE (internal/cli/assets) must equal a
    # fresh build from the agent-action-capsule commit report.go pins.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned agent-action-capsule commit
        id: pin
        run: |
          rev=$(sed -n 's/.*evidenceGraphIIFESource = "agent-action-capsule [a-z]*@\([0-9a-f]\{40\}\) .*/\1/p' internal/cli/report.go)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Check out agent-action-capsule at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: ${{ steps.pin.outputs.rev }}
          path: aac
          persist-credentials: false
      - name: Rebuild the IIFE and compare with the vendored copy
        run: |
          node --version
          make iife-check AAC="$GITHUB_WORKSPACE/aac"

  seal-pr-capsule:
    # Same-repo PRs only: a fork PR's pull_request event carries no repository
    # secrets, so sealing (which needs the producer/checkpoint signing keys)
    # cannot run against it. Runs on any outcome of quality/test so a failing
    # PR still gets a capsule recording that CI failed, not just green ones.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Seal PR capsule
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-body: ${{ github.event.pull_request.body }}
          ci-jobs-json: ${{ format('{{"quality":"{0}","test":"{1}"}}', needs.quality.result, needs.test.result) }}
          producer-signing-key: ${{ secrets.CAPSULE_PRODUCER_SIGNING_KEY }}
          producer-trusted-key: ${{ vars.CAPSULE_PRODUCER_TRUSTED_KEY }}
          checkpoint-signing-key: ${{ secrets.CAPSULE_CHECKPOINT_SIGNING_KEY }}
          checkpoint-trusted-key: ${{ vars.CAPSULE_CHECKPOINT_TRUSTED_KEY }}
          witness-public-key: ${{ vars.CAPSULE_WITNESS_PUBLIC_KEY }}
