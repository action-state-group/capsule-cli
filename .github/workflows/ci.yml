name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: every case under the race detector (see the tests job's env).
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # The nightly run has a group of its own: a push to main must not cancel it
  # (pushes and PRs still cancel their own superseded runs).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Refuse committed env files
        run: |
          # .gitignore excludes .env and .env.*; this catches one committed anyway (git add -f, a
          # rename). Example files (*.example) are allowed. ls-files runs on its own line, so a
          # failure fails the step instead of reading as "no env files".
          tracked="$(git ls-files)"
          bad="$(printf '%s\n' "$tracked" | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$bad" ]; then
            printf '::error::env file(s) committed; remove them from the repository and rotate any secret they held:\n%s\n' "$bad"
            exit 1
          fi
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: The core depends only on neutral modules
        # The donatable core (capsule-cli#236, #326): every action-state-group
        # module in its build graph, tests included, is on the neutral list,
        # and its go.mod requires no company-OSS module.
        run: |
          bash scripts/check-neutral-deps.sh
          if grep -n evidencebook go.mod; then
            echo "::error::the core go.mod requires evidencebook"
            exit 1
          fi
      - name: Nothing points into the trees that moved out
        # The first-party plugins and the deal skill live in evidencebook and
        # evidencebook-deal (capsule-cli#326): their trees are gone, and no
        # file here names a path in them.
        run: bash scripts/check-moved-paths.sh --fail
      - name: The test sharding script splits every test once
        run: bash scripts/check-shard-tests.sh
      - name: Vet
        run: go vet ./...
      - name: Check the rendered skill files match spec.yaml
        run: go run ./cmd/skillgen --check
      - name: Build CLI
        run: make build

  tests:
    # The race detector (the slowest case loops sampled) split by measured test
    # time across eight jobs, and every case without it across two: see
    # scripts/test.sh and scripts/test-weights.sh. One job running both
    # passes took 13-15 minutes and hit go test's 15-minute timeout on PR runs and on the nightly; at four
    # race shards and one plain job, the plugin package grew past the race
    # shard's 15 minutes and the plain pass's 10 (capsule-cli#403). Cut by
    # name, six race shards still ran at 14 minutes (capsule-cli#407).
    strategy:
      fail-fast: false
      matrix:
        part:
          - { pass: race, shard: 1/8 }
          - { pass: race, shard: 2/8 }
          - { pass: race, shard: 3/8 }
          - { pass: race, shard: 4/8 }
          - { pass: race, shard: 5/8 }
          - { pass: race, shard: 6/8 }
          - { pass: race, shard: 7/8 }
          - { pass: race, shard: 8/8 }
          - { pass: plain, shard: 1/2 }
          - { pass: plain, shard: 2/2 }
    name: test (${{ matrix.part.pass }} ${{ matrix.part.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: capsule_cli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Explicitly enable integration tests against the disposable service.
      CAPSULE_CLI_TEST_MYSQL_PORT: "3306"
      # The nightly run samples nothing: every case under the race detector.
      CAPSULE_TEST_RACE_FULL: ${{ github.event_name == 'schedule' && '1' || '' }}
      CAPSULE_TEST_PASS: ${{ matrix.part.pass }}
      CAPSULE_TEST_SHARD: ${{ matrix.part.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and MySQL integration tests (${{ matrix.part.pass }}, shard ${{ matrix.part.shard }})
        run: bash scripts/test.sh

  test:
    # One result under the job name checks and the PR capsule already use.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests passed
        run: test "${{ needs.tests.result }}" = success

  report-page:
    # The README's report of sealed records, opened in headless Chrome (the
    # runner's own): the page must render the report and say it verified, and
    # a copy with one payload edited must say it failed. See
    # scripts/check-html-render.sh.
    name: report page renders and checks itself
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the report and check its page
        env:
          CHROME: google-chrome
        run: bash scripts/check-html-render.sh

  iife:
    # The vendored evidence-graph IIFE (cli/assets) must equal a
    # fresh build from the capsule-viewer and agent-action-capsule commits
    # evidence_graph_assets.go pins.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned capsule-viewer and agent-action-capsule commits
        id: pin
        run: |
          src=cli/evidence_graph_assets.go
          cv=$(sed -n 's/.*evidenceGraphIIFESource = "capsule-viewer [a-z]*@\([0-9a-f]\{40\}\) .*/\1/p' "$src")
          aac=$(sed -n 's/.*evidenceGraphIIFESource = ".* agent-action-capsule [a-z]*@\([0-9a-f]\{40\}\) .*/\1/p' "$src")
          test -n "$cv" && test -n "$aac"
          echo "cv=$cv" >> "$GITHUB_OUTPUT"
          echo "aac=$aac" >> "$GITHUB_OUTPUT"
      - name: Check out capsule-viewer's main (ancestor check only, no build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/capsule-viewer
          ref: main
          path: cv-main-check
          fetch-depth: 0
          persist-credentials: false
      - name: Check out agent-action-capsule's main (ancestor check only, no build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: main
          path: aac-main-check
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a pin that is not on its repository's main
        # Each pin must name a commit merged on its repository's main, never
        # an open PR's or a fork's head: the vendored IIFE ships in
        # report.html, and the next steps install both commits' packages.
        # The sed above already limits each value to 40 hex.
        env:
          CV: ${{ steps.pin.outputs.cv }}
          AAC: ${{ steps.pin.outputs.aac }}
        run: |
          if ! git -C cv-main-check merge-base --is-ancestor "$CV" HEAD; then
            echo "::error file=cli/evidence_graph_assets.go::evidenceGraphIIFESource pins capsule-viewer $CV, which is not on capsule-viewer's main. Pin a merged commit."
            exit 1
          fi
          if ! git -C aac-main-check merge-base --is-ancestor "$AAC" HEAD; then
            echo "::error file=cli/evidence_graph_assets.go::evidenceGraphIIFESource pins agent-action-capsule $AAC, which is not on agent-action-capsule's main. Pin a merged commit."
            exit 1
          fi
      - name: Check out capsule-viewer at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/capsule-viewer
          ref: ${{ steps.pin.outputs.cv }}
          path: cv
          persist-credentials: false
      - name: Check out agent-action-capsule at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: ${{ steps.pin.outputs.aac }}
          path: aac
          persist-credentials: false
      - name: Rebuild the IIFE and compare with the vendored copy
        run: |
          node --version
          make iife-check CV="$GITHUB_WORKSPACE/cv" AAC="$GITHUB_WORKSPACE/aac"

  seal-pr-capsule:
    # Same-repo PRs only: a fork PR's pull_request event carries no repository
    # secrets, so sealing (which needs the producer/checkpoint signing keys)
    # cannot run against it. Runs on any outcome of quality/test so a failing
    # PR still gets a capsule recording that CI failed, not just green ones.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Seal PR capsule
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-body: ${{ github.event.pull_request.body }}
          ci-jobs-json: ${{ format('{{"quality":"{0}","test":"{1}"}}', needs.quality.result, needs.test.result) }}
          producer-signing-key: ${{ secrets.CAPSULE_PRODUCER_SIGNING_KEY }}
          producer-trusted-key: ${{ vars.CAPSULE_PRODUCER_TRUSTED_KEY }}
          checkpoint-signing-key: ${{ secrets.CAPSULE_CHECKPOINT_SIGNING_KEY }}
          checkpoint-trusted-key: ${{ vars.CAPSULE_CHECKPOINT_TRUSTED_KEY }}
          witness-public-key: ${{ vars.CAPSULE_WITNESS_PUBLIC_KEY }}
