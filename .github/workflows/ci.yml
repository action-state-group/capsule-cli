name: CI

on:
  push:
    branches: [main]
    # The race shards' inputs, which cover every other job's: the tests read
    # nearly the whole tree (TestCoreNamesNoCompanyPlugin walks it, skipping
    # design directories). CHANGELOG.md and changelog.d stay in: the commit a
    # release tags only cuts the changelog and needs a green run on main
    # (docs/RELEASING.md, B).
    paths:
      - "**"
      - "!docs/design/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: the race shards on main again, catching drift in the runner
    # image or the mysql:8.4 tag with no commit.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run. Runs on main, the
  # nightly and manual runs each get a group of their own, so none is ever
  # cancelled or replaced.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Refuse committed env files
        run: bash scripts/check-env-files.sh
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: The core depends only on neutral modules
        # The donatable core (capsule-cli#236, #326): every action-state-group
        # module in its build graph, tests included, is on the neutral list,
        # and its go.mod requires no company-OSS module.
        run: bash scripts/check-neutral-deps.sh
      - name: Nothing points into the trees that moved out
        # The first-party plugins and the deal skill live in their own
        # repositories (capsule-cli#326): their trees are gone, and no
        # file here names a path in them.
        run: bash scripts/check-moved-paths.sh --fail
      - name: The test sharding script splits every test once
        run: bash scripts/check-shard-tests.sh
      - name: Vet
        run: go vet ./...
      - name: Check the rendered skill files match spec.yaml
        run: go run ./cmd/skillgen --check
      - name: Build CLI
        run: make build

  tests:
    # The race detector split by measured test time across eight jobs, and
    # every case without it across two: see
    # scripts/test.sh and scripts/test-weights.sh. One job running both
    # passes took 13-15 minutes and hit go test's 15-minute timeout on PR runs and on the nightly; at four
    # race shards and one plain job, the plugin package grew past the race
    # shard's 15 minutes and the plain pass's 10 (capsule-cli#403). Cut by
    # name, six race shards still ran at 14 minutes (capsule-cli#407).
    # Pull requests run the two plain shards only; the eight race shards run
    # on push to main and on the nightly, four at a time
    # (asg-agent-team-ethan#409). `make check` runs both passes, and every
    # other pull request job but seal-pr-capsule, locally.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '[{"pass":"plain","shard":"1/2"},{"pass":"plain","shard":"2/2"}]' || '[{"pass":"race","shard":"1/8"},{"pass":"race","shard":"2/8"},{"pass":"race","shard":"3/8"},{"pass":"race","shard":"4/8"},{"pass":"race","shard":"5/8"},{"pass":"race","shard":"6/8"},{"pass":"race","shard":"7/8"},{"pass":"race","shard":"8/8"},{"pass":"plain","shard":"1/2"},{"pass":"plain","shard":"2/2"}]') }}
    name: test (${{ matrix.part.pass }} ${{ matrix.part.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: capsule_cli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Explicitly enable integration tests against the disposable service.
      CAPSULE_CLI_TEST_MYSQL_PORT: "3306"
      CAPSULE_TEST_PASS: ${{ matrix.part.pass }}
      CAPSULE_TEST_SHARD: ${{ matrix.part.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and MySQL integration tests (${{ matrix.part.pass }}, shard ${{ matrix.part.shard }})
        run: bash scripts/test.sh

  test:
    # One result under the job name checks and the PR capsule already use:
    # the plain shards on a pull request, every shard elsewhere.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests passed
        run: test "${{ needs.tests.result }}" = success

  report-page:
    # The README's report of sealed records, opened in headless Chrome (the
    # runner's own): the page must render the report and say it verified, and
    # a copy with one payload edited must say it failed. See
    # scripts/check-html-render.sh.
    name: report page renders and checks itself
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the report and check its page
        env:
          CHROME: google-chrome
        run: bash scripts/check-html-render.sh

  seal-pr-capsule:
    # Same-repo PRs only: a fork PR's pull_request event carries no repository
    # secrets, so sealing (which needs the producer/checkpoint signing keys)
    # cannot run against it. Runs on any outcome of quality/test so a failing
    # PR still gets a capsule recording that CI failed, not just green ones.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Seal PR capsule
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-body: ${{ github.event.pull_request.body }}
          ci-jobs-json: ${{ format('{{"quality":"{0}","test":"{1}"}}', needs.quality.result, needs.test.result) }}
          producer-signing-key: ${{ secrets.CAPSULE_PRODUCER_SIGNING_KEY }}
          producer-trusted-key: ${{ vars.CAPSULE_PRODUCER_TRUSTED_KEY }}
          checkpoint-signing-key: ${{ secrets.CAPSULE_CHECKPOINT_SIGNING_KEY }}
          checkpoint-trusted-key: ${{ vars.CAPSULE_CHECKPOINT_TRUSTED_KEY }}
          witness-public-key: ${{ vars.CAPSULE_WITNESS_PUBLIC_KEY }}

  report-failure:
    # A red run on main or the nightly opens or comments on one ci-red issue
    # (.github/scripts/report-failure.sh); a manual run on a branch does not.
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [quality, tests, test, report-page]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
