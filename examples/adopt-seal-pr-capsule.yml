# Template for adopting the seal-pr-capsule action in another repo.
#
# Not run from this location — copy it into that repo's own
# .github/workflows/ and rename the job(s) it depends on. `needs:` only
# resolves jobs in the SAME workflow file, so the seal job must live
# alongside (or be folded into) whatever job(s) already run your PR checks;
# it cannot react to a separate CI workflow without a workflow_run trigger.
#
# `uses: action-state-group/capsule-cli@<pinned-tag-or-sha>` checks out this
# action's own source into a separate temp directory at run time — you do not
# need to check out capsule-cli yourself. Your own repo still needs its own
# `actions/checkout` step (with fetch-depth: 0, so both PR endpoints are
# present for the diff digest) before this action runs.
#
# Required repo configuration (ask an org owner to provision these; see
# README.md "Configuring the Action" for how the producer/checkpoint keys are
# generated and why the witness key must be pinned independently, not fetched
# at run time):
#   Secrets:  CAPSULE_PRODUCER_SIGNING_KEY, CAPSULE_CHECKPOINT_SIGNING_KEY
#   Variables: CAPSULE_PRODUCER_TRUSTED_KEY, CAPSULE_CHECKPOINT_TRUSTED_KEY,
#              CAPSULE_WITNESS_PUBLIC_KEY

name: Seal PR Capsule

on:
  pull_request:
    # closed seals the merge-decision capsule (docs/PR-CAPSULE-PROFILE.md).
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  your_existing_ci_job:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "replace with your repo's real build/test steps"

  seal-pr-capsule:
    if: always() && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [your_existing_ci_job]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: action-state-group/capsule-cli@REPLACE_WITH_PINNED_TAG_OR_SHA
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-body: ${{ github.event.pull_request.body }}
          ci-jobs-json: ${{ format('{{"your_existing_ci_job":"{0}"}}', needs.your_existing_ci_job.result) }}
          producer-signing-key: ${{ secrets.CAPSULE_PRODUCER_SIGNING_KEY }}
          producer-trusted-key: ${{ vars.CAPSULE_PRODUCER_TRUSTED_KEY }}
          checkpoint-signing-key: ${{ secrets.CAPSULE_CHECKPOINT_SIGNING_KEY }}
          checkpoint-trusted-key: ${{ vars.CAPSULE_CHECKPOINT_TRUSTED_KEY }}
          witness-public-key: ${{ vars.CAPSULE_WITNESS_PUBLIC_KEY }}

  # The merge decision. Same-repo PRs only, for the same reason as above: a
  # fork PR's closed event carries no repository secrets either. Do not move
  # this to pull_request_target to reach forks; that event runs with secrets
  # in the base repository's context.
  seal-pr-decision:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The CI conclusions the head commit carried when the PR closed, in the
      # same job name -> conclusion shape the head capsule digested (the
      # latest completed run of each job wins), and the head capsule this
      # decision confirms: the one the action's head-capsule comment names for
      # this head SHA. The decision capsule's own comment starts differently,
      # so a re-run of this job never picks it up as its parent. Both are
      # conveniences; a verifier rechecks them (docs/PR-CAPSULE-PROFILE.md,
      # "How a verifier checks it").
      - id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ci=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "your_existing_ci_job") | {name, conclusion, completed_at}' \
            | jq -s -c 'sort_by(.completed_at) | map({(.name): .conclusion}) | add // {}')
          parent=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Sealed [Agent Action Capsule]")) and (.body | contains("for head `" + env.HEAD_SHA + "`"))) | .body' \
            | grep -oE '^Sealed \[Agent Action Capsule\]\([^)]*\) `[0-9a-f]{64}`' | grep -oE '[0-9a-f]{64}' | tail -n1 || true)
          {
            echo "ci-jobs-json=${ci}"
            echo "parent-capsule-id=${parent}"
          } >> "$GITHUB_OUTPUT"

      - uses: action-state-group/capsule-cli@REPLACE_WITH_PINNED_TAG_OR_SHA
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-author: ${{ github.event.pull_request.user.login }}
          ci-jobs-json: ${{ steps.prior.outputs.ci-jobs-json }}
          record-reviews: 'true'
          merge-decision: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}
          decided-at: ${{ github.event.pull_request.merged && github.event.pull_request.merged_at || github.event.pull_request.closed_at }}
          decided-by-type: ${{ github.event.pull_request.merged && github.event.pull_request.merged_by.type || github.event.sender.type }}
          parent-capsule-id: ${{ steps.prior.outputs.parent-capsule-id }}
          producer-signing-key: ${{ secrets.CAPSULE_PRODUCER_SIGNING_KEY }}
          producer-trusted-key: ${{ vars.CAPSULE_PRODUCER_TRUSTED_KEY }}
          checkpoint-signing-key: ${{ secrets.CAPSULE_CHECKPOINT_SIGNING_KEY }}
          checkpoint-trusted-key: ${{ vars.CAPSULE_CHECKPOINT_TRUSTED_KEY }}
          witness-public-key: ${{ vars.CAPSULE_WITNESS_PUBLIC_KEY }}
