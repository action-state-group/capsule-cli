# Semantic spec for the capsulectl skill, validated against
# ../../schemas/skill-spec-v0.json. Rendered (never hand-edited) into
# SKILL.md (Claude Code shape) and AGENTS.md (Codex shape) by
# `go run ../../cmd/skillgen`. Edit this file, then regenerate — see
# ../SKILL-SPEC.md for the contract.
#
# Verb surface note: the batch brief names seven verbs as one flat list
# (verify, contract validate, discover, plugin ls, cll, get, publish). `cll`
# covers two distinct subcommands with different argument shapes and
# different emission mechanics (`list` only reads; `append` itself creates
# the durable record), so this spec documents them as two verb entries —
# `cll list` and `cll append` — rather than force one entry to describe two
# behaviors. Nothing here documents a verb capsulectl does not implement
# today; the spec grows when the binary does, never by guessing ahead of
# it.
#
# Guardrails note: `may`/`must_never`/`approval_points`/`evidence_policy`
# below are the ruling of 2026-09-22 (replaces an earlier placeholder),
# quoted verbatim. `may`/`must_never` were
# dictated as one semicolon-separated sentence per category; each array
# item below is one clause of that sentence, split at the semicolons with
# no word changed — the exact source sentence is quoted in a comment above
# each field so the split can be checked against it. `approval_points` was
# dictated as one sentence sharing a single "stop and ask a human" subject
# across four "before/whenever" clauses; each array item restates that
# shared subject against one clause, again with no word changed beyond the
# repetition the shared subject requires. `evidence_policy` is quoted
# whole, unsplit, because it is prose (a rule and its exception), not a
# list.
#
# Ruling also fixed the scope this item's original brief left ambiguous:
# capsule emission is for CONSEQUENTIAL actions only. `result open` (the
# other Batch 5 item's verb) and local validation generally get no capsule.
# Applied here as `emission_mode: not-consequential` on every verb in this
# surface that only reads, checks or validates rather than durably writing
# or persisting something (`verify`, `contract validate`, `plugin ls`,
# `cll list`, `get`) — narrower than this file's first draft, which wrapped
# all of them in a seal call. `discover` keeps `self-sealing` (the binary
# itself requires `--seal-output`, unrelated to this skill's own choice)
# and `publish`/`cll append` keep `primary-action` (a durable write is
# exactly what "consequential" means here).
spec_version: skill-spec/v0
skill:
  name: capsulectl
  description: >-
    Call the capsulectl verb surface to inspect, validate and record Agent
    Action Capsules — never to reason about business meaning or invent a
    workflow beyond the verbs listed below.

# Verbatim: "call only the verbs listed in this file; validate a contract;
# run `discover` against a scope file supplied by the operator; request
# evidence; verify a bundle; open a result."
may:
  - call only the verbs listed in this file
  - validate a contract
  - "run `discover` against a scope file supplied by the operator"
  - request evidence
  - verify a bundle
  - open a result

# Verbatim: "create or modify a scope file, Evidence Contract, or licence;
# invent a relationship between a requirement and an evidence source;
# modify, summarize, reinterpret, or restate the output of `verify`;
# describe self-attested evidence as witnessed, countersigned, or
# independently verified; or transmit data off-machine without first
# showing exactly what will be transmitted."
must_never:
  - create or modify a scope file, Evidence Contract, or licence
  - invent a relationship between a requirement and an evidence source
  - "modify, summarize, reinterpret, or restate the output of `verify`"
  - describe self-attested evidence as witnessed, countersigned, or independently verified
  - transmit data off-machine without first showing exactly what will be transmitted

# Verbatim (one sentence, shared subject "stop and ask a human" distributed
# across four before/whenever clauses): "stop and ask a human before the
# first witness registration from a new key; before any publish operation;
# before `discover` traverses a root not already authorized by the scope
# file; and whenever a command fails because of a licence, plugin, or
# authorization requirement."
approval_points:
  - Stop and ask a human before the first witness registration from a new key.
  - Stop and ask a human before any publish operation.
  - "Stop and ask a human before `discover` traverses a root not already authorized by the scope file."
  - Stop and ask a human whenever a command fails because of a licence, plugin, or authorization requirement.

# Verbatim.
evidence_policy: >-
  Every consequential action taken by this skill must produce an evidence
  record. If evidence generation fails, report `evidence unavailable`, stop
  before the next consequential action, and do not infer that the
  underlying action failed to occur.

verbs:
  - name: verify
    args:
      - "--profile NAME"
      - "--capsule FILE"
    when: >-
      Confirm a Capsule's identity, signature, trust and bound artifacts
      before treating it as authentic — including a record another verb in
      this same run just fetched with `get --raw`.
    emits: (no capsule — checking a bundle is local validation, not a consequential action)
    emission_mode: not-consequential

  - name: contract validate
    args:
      - "FILE --schema PATH_OR_URL"
      - "FILE --schema PATH_OR_URL --json"
    when: >-
      Check a caller-supplied document against a JSON Schema before
      accepting, forwarding or acting on it. capsulectl embeds no schema of
      its own; --schema always names the caller's.
    emits: (no capsule — this is the local validation the evidence policy names explicitly)
    emission_mode: not-consequential

  - name: discover
    args:
      - "--profile NAME --scope FILE --seal-output FILE"
      - "--profile NAME --scope FILE --effects --seal-output FILE"
      - "--profile NAME --scope FILE --format table|json --seal-output FILE"
    when: >-
      Build a read-only inventory of OTel/MCP/gateway/CI/repo config (or, with
      --effects, an effect-boundary map) strictly within the roots an operator
      named in --scope. Never invents a scope; refuses to run without one.
    emits: discover-scan/v1 (plain) or discover-effects-scan/v1 (--effects)
    emission_mode: self-sealing

  - name: plugin ls
    args: []
    when: >-
      List trusted, handshake-valid capsulectl-* plugins discovered on the
      trusted plugin roots before invoking one by name.
    emits: (no capsule — listing what is discovered is local inspection, not a consequential action)
    emission_mode: not-consequential

  - name: cll list
    args:
      - "--profile NAME"
      - "--profile NAME --after N --through N --limit N"
    when: >-
      Read the profile's checkpointed log in sequence order — to find an
      entry, to page through a range, or to confirm an append landed.
    emits: (no capsule — reading the log is local inspection, not a consequential action)
    emission_mode: not-consequential

  - name: cll append
    args:
      - "--profile NAME --capsule FILE"
    when: >-
      Add an already-sealed, already-verified Capsule (one with no missing
      original bindings) to the log as a new entry.
    emits: (the appended Capsule itself is the record; no wrapper capsule)
    emission_mode: primary-action

  - name: get
    args:
      - "--profile NAME --capsule-id ID"
      - "--profile NAME --capsule-id ID --raw --output FILE"
    when: >-
      Read an existing artifact SDK record by capsule_id — plain for
      inspection, --raw when the exact bytes must be handed to verify.
    emits: (no capsule — reading a record is local inspection, not a consequential action)
    emission_mode: not-consequential

  - name: publish
    args:
      - "--profile NAME --request FILE"
    when: >-
      Seal a capsule-seal-request/v1, persist its artifacts, and append it to
      the CLL in one step — the primary way the skill records that it took an
      action with a real, durable effect.
    emits: (publish's own result IS the capsule; no wrapper)
    emission_mode: primary-action

  # The four verbs below are [capsulectl-book-verbs-v0]'s no-book-required
  # half: the deterministic remainder of the retired capsule-judge harness
  # (judge_pin_digest, the drift check, the calibration fold), ported so the
  # prompting/scoring half can stay a skill instead. None needs --profile;
  # none produces a capsule of its own -- a caller wanting one of these
  # values sealed into the book cites it as a field on whatever record it
  # helped produce (an evaluation-report/v1's own judge_pin, for instance),
  # never as a standalone wrapper.
  - name: judge pin
    args:
      - "FILE"
    when: >-
      Compute a judge_pin_digest from a reproducible judge configuration
      (model id, model version, sampling params, prompt digest, axes
      digest) before citing it into an evaluation-report/v1 the skill is
      about to seal.
    emits: (no capsule — this is a pure computation over caller-supplied input)
    emission_mode: not-consequential

  - name: judge drift pin
    args:
      - "FILE_A FILE_B"
    when: >-
      Confirm two judge-pin inputs describe the same reproducible judge
      configuration before treating their outputs as comparable.
    emits: (no capsule — this is local comparison, not a consequential action)
    emission_mode: not-consequential

  - name: judge drift reports
    args:
      - "FILE_A FILE_B"
    when: >-
      Compare two evaluation-report/v1 sets by case_id and show drift as a
      real delta (pin mismatch, label mismatch, or both) — never as a
      silent disagreement the skill quietly drops.
    emits: (no capsule — this is local comparison, not a consequential action)
    emission_mode: not-consequential

  - name: calibration summarize
    args:
      - "REPORTS_FILE RATINGS_FILE"
    when: >-
      Fold an evaluation-report/v1 set and a human-rating/v1 set into k-of-n
      agreement per judge_pin_digest before citing the result into a
      calibration-summary/v1 the skill is about to seal.
    emits: (no capsule — this is a pure computation over caller-supplied input)
    emission_mode: not-consequential

  # The four verbs below run over a jsonl profile's evidence book, the
  # `book/` directory in its store and the profile's one log (publish and
  # cll use it too). They need a jsonl profile with log_id, operator, a signing key the
  # profile trusts, and a checkpoint signing key it trusts. A counterparty is
  # named by its book id (its profile's log_id), and a peer bundle must come
  # from that book under the checkpoint key given for it. A Close covers every
  # correlated exchange in its window that names no counterparty or this one;
  # a window holding an exchange named for another counterparty is refused.
  - name: request
    args:
      - "--profile NAME --request FILE --responder NAME --output FILE"
      - "--profile NAME --for RECORD_ID --response FILE --responder-key HEX --responder-checkpoint-key HEX"
      - "--profile NAME --for RECORD_ID --absent-until TIME"
    when: >-
      Ask a party for evidence (the request is recorded before it is sent),
      then record exactly one outcome for it: the answer that came back, or
      that nothing came back in the window. The output file is what to
      transmit; this verb transmits nothing itself.
    emits: (each mode's own book record is the evidence; no wrapper capsule)
    emission_mode: primary-action

  - name: respond
    args:
      - "--profile NAME --request FILE --requester ID --output FILE"
      - "--profile NAME --request FILE --requester ID --policy FILE --output FILE"
    when: >-
      Answer a received evidence request with a signed artifact or a signed
      refusal, under the share policy, and record that it was answered. The
      output file is what to send back; this verb transmits nothing itself.
    emits: (the book's record of the answered request is the evidence; no wrapper capsule)
    emission_mode: primary-action

  - name: close
    args:
      - "--profile NAME --period day|week --counterparty ID"
      - "--profile NAME --period day|week --date YYYY-MM-DD --counterparty ID --since-last"
      - "--profile NAME --period day|week --counterparty BOOK_ID --peer FILE --peer-checkpoint-key HEX"
      - "--profile NAME --period day|week --counterparty ID --capsule-out FILE --bundle-out FILE"
    when: >-
      Seal the book's Close for a period that has ended, for one
      counterparty. Without a held peer bundle every exchange reads
      INSUFFICIENT: the Close states only this book's account. Repeating it
      for the same period and counterparty returns the first Close and seals
      no second one; the peer bundle and --since-last of a repeat are not
      applied.
    emits: (the Close record itself; --capsule-out writes it for verify)
    emission_mode: primary-action

  - name: reconcile
    args:
      - "--profile NAME --period day|week --counterparty BOOK_ID --peer FILE --peer-checkpoint-key HEX"
    when: >-
      Compare this book's period with a counterparty's held bundle, showing
      each exchange in one of six states, as of this book's latest
      checkpoint: an own exchange not yet checkpointed reads INSUFFICIENT
      until `close` checkpoints it. It never queries the counterparty and
      adds no record.
    emits: (no capsule — comparing held records is local comparison, not a consequential action)
    emission_mode: not-consequential
